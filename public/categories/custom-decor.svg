<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="decorBg" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#F5F3FF" />
      <stop offset="100%" stop-color="#EDE9FE" />
    </radialGradient>
    <linearGradient id="pennantPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <linearGradient id="pennantTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <linearGradient id="pennantGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="brushPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>
    <filter id="shadowDecor" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2B2B3A" flood-opacity="0.12" />
    </filter>
  </defs>

  <circle cx="80" cy="80" r="76" fill="url(#decorBg)" />

  <g filter="url(#shadowDecor)">
    <!-- Top Bunting String -->
    <path d="M 28 48 Q 80 62 132 48" stroke="#64748B" stroke-width="1.8" fill="none" />

    <!-- Hanging Pennants with Letters "DIY" -->
    <!-- Pennant 1 (Pink) -->
    <polygon points="40,51 60,55 50,82" fill="url(#pennantPink)" />
    <text x="50" y="68" fill="#FFFFFF" font-size="11" font-family="sans-serif" font-weight="900" text-anchor="middle">D</text>

    <!-- Pennant 2 (Gold) -->
    <polygon points="68,57 92,57 80,86" fill="url(#pennantGold)" />
    <text x="80" y="72" fill="#FFFFFF" font-size="12" font-family="sans-serif" font-weight="900" text-anchor="middle">I</text>

    <!-- Pennant 3 (Teal) -->
    <polygon points="100,55 120,51 110,82" fill="url(#pennantTeal)" />
    <text x="110" y="68" fill="#FFFFFF" font-size="11" font-family="sans-serif" font-weight="900" text-anchor="middle">Y</text>

    <!-- Custom Banner Board / Palette in foreground -->
    <g transform="translate(48, 86)">
      <!-- Chalkboard / Banner Tag -->
      <rect x="0" y="6" width="64" height="34" rx="5" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <text x="32" y="22" fill="#E11D48" font-size="8" font-family="sans-serif" font-weight="bold" text-anchor="middle">CUSTOM</text>
      <text x="32" y="32" fill="#0F766E" font-size="7.5" font-family="sans-serif" font-weight="bold" text-anchor="middle">★ YOUR NAME ★</text>
    </g>

    <!-- Craft Brush / Pen -->
    <g transform="translate(104, 94) rotate(45)">
      <rect x="0" y="0" width="6" height="26" rx="2" fill="url(#brushPurple)" />
      <polygon points="0,26 6,26 3,34" fill="#F59E0B" />
    </g>
  </g>

  <!-- Sparkles & dots -->
  <circle cx="34" cy="94" r="3" fill="#A855F7" opacity="0.6" />
  <circle cx="126" cy="40" r="2.5" fill="#EC4899" opacity="0.6" />
  <path d="M 32 38 L 34 34 L 36 38 L 40 39 L 36 40 L 34 44 L 32 40 L 28 39 Z" fill="#F59E0B" />
</svg>