<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="bachBg" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FDF2F8" />
      <stop offset="100%" stop-color="#FCE7F3" />
    </radialGradient>
    <linearGradient id="ringGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="50%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="sashPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>
    <filter id="shadowBach" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#2B2B3A" flood-opacity="0.14" />
    </filter>
  </defs>

  <circle cx="80" cy="80" r="76" fill="url(#bachBg)" />

  <g filter="url(#shadowBach)">
    <!-- Confetti Balloon in background -->
    <ellipse cx="106" cy="54" rx="19" ry="24" fill="#FFFFFF" stroke="#F472B6" stroke-width="1.5" opacity="0.9" />
    <circle cx="98" cy="48" r="3" fill="#EC4899" />
    <circle cx="112" cy="52" r="2.5" fill="#F59E0B" />
    <circle cx="104" cy="62" r="3" fill="#8B5CF6" />
    <circle cx="114" cy="42" r="2" fill="#06B6D4" />
    <path d="M 106 78 L 103 82 L 109 82 Z" fill="#F472B6" />
    <path d="M 106 82 Q 110 96 100 115" stroke="#94A3B8" stroke-width="1.2" fill="none" />

    <!-- Big Diamond Ring Prop -->
    <!-- Gold Ring Loop -->
    <circle cx="68" cy="88" r="24" fill="none" stroke="url(#ringGold)" stroke-width="7" />
    <!-- Diamond Mount -->
    <path d="M 62 67 L 74 67 L 71 63 L 65 63 Z" fill="url(#ringGold)" />
    <!-- Faceted Diamond -->
    <path d="M 54 50 L 82 50 L 92 61 L 68 83 L 44 61 Z" fill="url(#diamondGrad)" />
    <!-- Facet Lines -->
    <polygon points="68,50 60,61 68,83" fill="#FFFFFF" opacity="0.4" />
    <polygon points="68,50 76,61 68,83" fill="#0284C7" opacity="0.3" />
    <line x1="54" y1="50" x2="60" y2="61" stroke="#FFFFFF" stroke-width="1" />
    <line x1="82" y1="50" x2="76" y2="61" stroke="#FFFFFF" stroke-width="1" />
    <line x1="44" y1="61" x2="92" y2="61" stroke="#FFFFFF" stroke-width="1" />

    <!-- Party Sash across the bottom -->
    <g transform="translate(40, 95) rotate(-8)">
      <path d="M 0 10 Q 40 4 80 12 L 78 24 Q 40 16 0 22 Z" fill="url(#sashPink)" />
      <text x="40" y="18" fill="#FEF08A" font-size="7.5" font-family="sans-serif" font-weight="900" text-anchor="middle" letter-spacing="1">BRIDE TO BE</text>
    </g>
  </g>

  <!-- Sparkles -->
  <path d="M 40 42 L 42 36 L 44 42 L 50 44 L 44 46 L 42 52 L 40 46 L 34 44 Z" fill="#F59E0B" />
  <circle cx="130" cy="80" r="3" fill="#F43F5E" opacity="0.8" />
</svg>