<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="kidBg" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF9E6" />
      <stop offset="100%" stop-color="#FFE7C4" />
    </radialGradient>
    <linearGradient id="balloonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="balloonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <linearGradient id="balloonYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <linearGradient id="partyHatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="shadowKid" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2B2B3A" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Circular Pastel Base -->
  <circle cx="80" cy="80" r="76" fill="url(#kidBg)" />

  <g filter="url(#shadowKid)">
    <!-- Blue Balloon Behind -->
    <ellipse cx="60" cy="62" rx="19" ry="24" fill="url(#balloonBlue)" transform="rotate(-12 60 62)" />
    <path d="M 59 86 L 56 90 L 62 90 Z" fill="#2563EB" />
    <path d="M 59 90 Q 55 105 66 120" stroke="#94A3B8" stroke-width="1.5" fill="none" stroke-linecap="round" />

    <!-- Yellow Balloon -->
    <ellipse cx="102" cy="60" rx="18" ry="23" fill="url(#balloonYellow)" transform="rotate(14 102 60)" />
    <path d="M 103 83 L 100 87 L 106 87 Z" fill="#CA8A04" />
    <path d="M 103 87 Q 108 102 96 120" stroke="#94A3B8" stroke-width="1.5" fill="none" stroke-linecap="round" />

    <!-- Pink Main Balloon (Center Left) -->
    <ellipse cx="80" cy="52" rx="21" ry="26" fill="url(#balloonPink)" />
    <!-- Balloon Highlight -->
    <ellipse cx="73" cy="42" rx="5" ry="8" fill="#FFFFFF" opacity="0.45" transform="rotate(-20 73 42)" />
    <path d="M 80 78 L 76 83 L 84 83 Z" fill="#BE123C" />
    <path d="M 80 83 Q 76 100 80 122" stroke="#94A3B8" stroke-width="1.5" fill="none" stroke-linecap="round" />

    <!-- Party Hat -->
    <path d="M 80 82 L 62 120 L 98 120 Z" fill="url(#partyHatGrad)" />
    <!-- Hat Stripes -->
    <path d="M 68 107 L 92 107 L 89 113 L 71 113 Z" fill="#FDE047" opacity="0.9" />
    <path d="M 74 95 L 86 95 L 83 100 L 77 100 Z" fill="#38BDF8" opacity="0.9" />
    <!-- Pom Pom Top -->
    <circle cx="80" cy="80" r="5" fill="#F43F5E" />
    <!-- Hat Base Trim -->
    <rect x="60" y="118" width="40" height="4" rx="2" fill="#E2E8F0" />
  </g>

  <!-- Confetti Stars & Dots -->
  <circle cx="36" cy="46" r="3" fill="#F43F5E" opacity="0.8" />
  <circle cx="122" cy="42" r="2.5" fill="#3B82F6" opacity="0.8" />
  <circle cx="128" cy="88" r="3" fill="#10B981" opacity="0.8" />
  <circle cx="32" cy="98" r="2.5" fill="#F59E0B" opacity="0.8" />
  <path d="M 44 72 L 46 76 L 50 76 L 47 79 L 48 83 L 44 80 L 40 83 L 41 79 L 38 76 L 42 76 Z" fill="#F59E0B" />
</svg>