<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="essentialsBg" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </radialGradient>
    <linearGradient id="pumpBodyTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="60%" stop-color="#00A8A8" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <linearGradient id="pumpHandlePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <linearGradient id="ribbonSpool" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadowEss" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#2B2B3A" flood-opacity="0.12" />
    </filter>
  </defs>

  <circle cx="80" cy="80" r="76" fill="url(#essentialsBg)" />

  <g filter="url(#shadowEss)">
    <!-- Manual Balloon Pump (Diagonal across background) -->
    <g transform="translate(42, 38) rotate(35)">
      <!-- Pump Nozzle -->
      <polygon points="12,0 16,0 17,14 11,14" fill="#E11D48" />
      <!-- Pump Main Cylinder -->
      <rect x="7" y="14" width="14" height="48" rx="3" fill="url(#pumpBodyTeal)" />
      <!-- Texture ridges -->
      <line x1="7" y1="26" x2="21" y2="26" stroke="#0F766E" stroke-width="1.5" />
      <line x1="7" y1="36" x2="21" y2="36" stroke="#0F766E" stroke-width="1.5" />
      <line x1="7" y1="46" x2="21" y2="46" stroke="#0F766E" stroke-width="1.5" />
      <!-- Pump Shaft & Handle -->
      <rect x="12" y="62" width="4" height="14" fill="#94A3B8" />
      <ellipse cx="14" cy="78" rx="10" ry="4" fill="url(#pumpHandlePink)" />
    </g>

    <!-- Balloon Glue Dot Tape Roll (Bottom Left) -->
    <g transform="translate(40, 84)">
      <!-- Tape Roll Outer -->
      <ellipse cx="22" cy="22" rx="18" ry="16" fill="#FFFFFF" stroke="#00A8A8" stroke-width="3" />
      <!-- Tape Roll Core Hole -->
      <ellipse cx="22" cy="22" rx="8" ry="7" fill="#FEF3C7" stroke="#CBD5E1" stroke-width="1.5" />
      <!-- Unspooled glue strip with clear dots -->
      <path d="M 38 24 Q 54 28 66 18" stroke="#E2E8F0" stroke-width="5" fill="none" stroke-linecap="round" />
      <!-- Glue dots on strip -->
      <circle cx="44" cy="25" r="2.5" fill="#00A8A8" />
      <circle cx="53" cy="24" r="2.5" fill="#00A8A8" />
      <circle cx="62" cy="20" r="2.5" fill="#00A8A8" />
    </g>

    <!-- Sparkling Birthday Candles & Curling Ribbon (Right) -->
    <g transform="translate(98, 70)">
      <!-- Candle 1 (Pink) -->
      <rect x="8" y="18" width="5" height="30" rx="2" fill="#E11D48" />
      <line x1="10.5" y1="18" x2="10.5" y2="13" stroke="#475569" stroke-width="1" />
      <path d="M 10.5 7 C 8.5 10 9.5 12 10.5 13 C 11.5 12 12.5 10 10.5 7 Z" fill="#F59E0B" />

      <!-- Candle 2 (Gold) -->
      <rect x="18" y="24" width="5" height="24" rx="2" fill="url(#ribbonSpool)" />
      <line x1="20.5" y1="24" x2="20.5" y2="19" stroke="#475569" stroke-width="1" />
      <path d="M 20.5 13 C 18.5 16 19.5 18 20.5 19 C 21.5 18 22.5 16 20.5 13 Z" fill="#F59E0B" />

      <!-- Golden Curling Ribbon swirl -->
      <path d="M 26 42 Q 34 32 30 20 Q 24 10 32 4" stroke="#F59E0B" stroke-width="2.5" fill="none" stroke-linecap="round" />
    </g>
  </g>

  <!-- Sparkles -->
  <path d="M 30 52 L 32 48 L 34 52 L 38 53 L 34 54 L 32 58 L 30 54 L 26 53 Z" fill="#F59E0B" />
  <circle cx="126" cy="46" r="3" fill="#00A8A8" opacity="0.7" />
</svg>