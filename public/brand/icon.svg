<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="Celebration Box Icon">
  <!-- Confetti & Streamer Burst -->
  <g id="celebration-burst">
    <path d="M 205 48 Q 205 64 221 64 Q 205 64 205 80 Q 205 64 189 64 Q 205 64 205 48 Z" fill="#FFB400" />
    <path d="M 165 142 Q 185 115 205 125 T 235 98" fill="none" stroke="#00A8A8" stroke-width="6.5" stroke-linecap="round" />
    <circle cx="192" cy="112" r="6" fill="#E91E63" />
    <circle cx="152" cy="128" r="5" fill="#FFB400" />
    <circle cx="172" cy="106" r="4.5" fill="#00A8A8" />
  </g>

  <!-- Box Body with flat straight bottom & rounded corners -->
  <rect x="84" y="160" width="132" height="105" rx="10" fill="#E91E63" />
  <!-- Box Interior Opening Lip -->
  <rect x="84" y="160" width="132" height="12" rx="4" fill="#C2185B" />
  <!-- Vertical Yellow Ribbon -->
  <rect x="136" y="160" width="28" height="105" fill="#FFB400" />

  <!-- Tilted Open Lid & Ribbon Bow (Tilted -24deg) -->
  <g transform="translate(76, 156) rotate(-24)">
    <!-- Yellow Ribbon Bow on Top Edge -->
    <g transform="translate(73, -30)">
      <path d="M 0 0 C -22 -28 -48 -14 -30 4 C -18 10 -8 4 0 0 Z" fill="#FFB400" />
      <path d="M 0 0 C 8 4 18 10 30 4 C 48 -14 22 -28 0 0 Z" fill="#FFB400" />
      <circle cx="0" cy="2" r="6.5" fill="#FFA000" />
    </g>
    <!-- Lid Bar -->
    <rect x="0" y="-30" width="146" height="30" rx="8" fill="#E91E63" />
    <!-- Lid Ribbon Band -->
    <rect x="59" y="-30" width="28" height="30" fill="#FFB400" />
  </g>
</svg>
