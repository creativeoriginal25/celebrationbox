<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 340" role="img" aria-label="Celebration Box Logo">
  <!-- 1. GIFT BOX ICON -->
  <g id="gift-box-icon">
    <!-- Confetti & Streamer Burst -->
    <g id="celebration-burst">
      <path d="M 195 62 Q 195 78 211 78 Q 195 78 195 94 Q 195 78 179 78 Q 195 78 195 62 Z" fill="#FFB400" />
      <path d="M 155 152 Q 175 125 195 135 T 225 108" fill="none" stroke="#00A8A8" stroke-width="6.5" stroke-linecap="round" />
      <circle cx="182" cy="122" r="6" fill="#E91E63" />
      <circle cx="142" cy="138" r="5" fill="#FFB400" />
      <circle cx="162" cy="116" r="4.5" fill="#00A8A8" />
    </g>

    <!-- Box Body with flat straight bottom & rounded corners -->
    <rect x="64" y="170" width="132" height="105" rx="10" fill="#E91E63" />
    <!-- Box Interior Opening Lip -->
    <rect x="64" y="170" width="132" height="12" rx="4" fill="#C2185B" />
    <!-- Vertical Yellow Ribbon -->
    <rect x="116" y="170" width="28" height="105" fill="#FFB400" />

    <!-- Tilted Open Lid & Ribbon Bow (Tilted -24deg) -->
    <g transform="translate(56, 166) rotate(-24)">
      <!-- Yellow Ribbon Bow on Top Edge -->
      <g transform="translate(73, -30)">
        <path d="M 0 0 C -22 -28 -48 -14 -30 4 C -18 10 -8 4 0 0 Z" fill="#FFB400" />
        <path d="M 0 0 C 8 4 18 10 30 4 C 48 -14 22 -28 0 0 Z" fill="#FFB400" />
        <circle cx="0" cy="2" r="6.5" fill="#FFA000" />
      </g>
      <!-- Lid Bar -->
      <rect x="0" y="-30" width="146" height="30" rx="8" fill="#E91E63" />
      <!-- Lid Ribbon Band -->
      <rect x="59" y="-30" width="28" height="30" fill="#FFB400" />
    </g>
  </g>

  <!-- 2. WORDMARK: "Celebration Box" -->
  <text x="268" y="232" font-family="'Poppins', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="122" font-weight="800" letter-spacing="-1.8">
    <tspan fill="#2B2B3A">Celebration </tspan>
    <tspan fill="#E91E63" font-weight="900">Box</tspan>
  </text>

  <!-- 3. GOLDEN SWOOSH & SPARKLE -->
  <path d="M 330 268 Q 540 232 730 250 Q 865 264 965 250" fill="none" stroke="#FFB400" stroke-width="9" stroke-linecap="round" />
  <path d="M 988 232 Q 988 250 1006 250 Q 988 250 988 268 Q 988 250 970 250 Q 988 250 988 232 Z" fill="#FFB400" />
</svg>
