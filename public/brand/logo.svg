<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 340" role="img" aria-label="Celebration Box Logo">
  <defs>
    <filter id="svgBoxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#2B2B3A" flood-opacity="0.14" />
    </filter>
    <filter id="svgStarGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FFB400" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- FESTIVE GIFT BOX ICON -->
  <g filter="url(#svgBoxShadow)">
    <!-- Confetti & Streamers -->
    <g id="celebration-burst">
      <path d="M 260 28 Q 260 50 282 50 Q 260 50 260 72 Q 260 50 238 50 Q 260 50 260 28 Z" fill="#FFB400" filter="url(#svgStarGlow)" />
      <path d="M 160 145 C 185 105 215 130 240 95 C 255 75 275 88 270 70" fill="none" stroke="#00A8A8" stroke-width="8" stroke-linecap="round" />
      <circle cx="255" cy="125" r="9.5" fill="#E91E63" />
      <path d="M 115 135 C 105 118 125 102 136 118 C 142 128 130 140 115 135 Z" fill="#FFB400" />
      <path d="M 152 110 C 146 92 168 80 174 100 C 178 112 162 122 152 110 Z" fill="#FFB400" />
    </g>

    <!-- Gift Box Base -->
    <path d="M 72 175 L 208 175 C 216 175 221 180 219 188 L 204 266 C 201 274 193 280 184 280 L 96 280 C 87 280 79 274 76 266 L 61 188 C 59 180 64 175 72 175 Z" fill="#E91E63" />
    <path d="M 124 175 L 156 175 L 151 280 L 129 280 Z" fill="#FFB400" />

    <!-- Gift Box Lid & Bow -->
    <g transform="rotate(-22 72 175)">
      <g transform="translate(140, 130)">
        <path d="M -8 -2 C -28 -35 -50 -20 -32 -2 C -20 6 -12 2 -8 2 Z" fill="#FFB400" />
        <path d="M 8 2 C 12 2 20 6 32 -2 C 50 -20 28 -35 8 -2 Z" fill="#FFB400" />
        <circle cx="0" cy="0" r="8" fill="#FFA000" />
      </g>
      <rect x="52" y="130" width="176" height="36" rx="11" fill="#E91E63" stroke="#D81B60" stroke-width="1.5" />
    </g>
  </g>

  <!-- UNIFIED TYPOGRAPHY (No Overlap) -->
  <text x="276" y="232" font-family="'Poppins', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="122" font-weight="800" letter-spacing="-1.8">
    <tspan fill="#2B2B3A">Celebration </tspan>
    <tspan fill="#E91E63" font-weight="900">Box</tspan>
  </text>

  <!-- DYNAMIC GOLDEN SWOOSH & SPARKLE -->
  <path d="M 340 268 Q 545 230 735 248 Q 870 262 970 248" fill="none" stroke="#FFB400" stroke-width="9" stroke-linecap="round" />
  <path d="M 992 230 Q 992 248 1010 248 Q 992 248 992 266 Q 992 248 974 248 Q 992 248 992 230 Z" fill="#FFB400" filter="url(#svgStarGlow)" />
</svg>
