<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="studioLighting" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#FAF4EE" />
      <stop offset="100%" stop-color="#EFE6DC" />
    </radialGradient>
    <linearGradient id="peachRealistic" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#FFE0D0" />
      <stop offset="35%" stop-color="#FFBE98" />
      <stop offset="85%" stop-color="#F39C6B" />
      <stop offset="100%" stop-color="#D97238" />
    </linearGradient>
    <linearGradient id="lilacRealistic" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#F5E6FA" />
      <stop offset="35%" stop-color="#D8B4E2" />
      <stop offset="85%" stop-color="#B885C6" />
      <stop offset="100%" stop-color="#9356A5" />
    </linearGradient>
    <linearGradient id="creamRealistic" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FFF5E5" />
      <stop offset="85%" stop-color="#F2DEC0" />
      <stop offset="100%" stop-color="#D9BC93" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="candlePink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4081" />
      <stop offset="100%" stop-color="#C2185B" />
    </linearGradient>
    <linearGradient id="candleGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>
    <linearGradient id="candleTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4DD0E1" />
      <stop offset="100%" stop-color="#00838F" />
    </linearGradient>

    <!-- Natural Soft Studio Shadows -->
    <filter id="softContactShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#2B2B3A" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2B2B3A" flood-opacity="0.06" />
    </filter>
    <filter id="itemShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2B2B3A" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Studio Surface -->
  <rect width="800" height="600" fill="url(#studioLighting)" />

  <!-- Studio Surface Grid / Aesthetic Table Runner (subtle) -->
  <rect x="100" y="80" width="600" height="440" rx="20" fill="#FFFFFF" opacity="0.6" />
  <rect x="100" y="80" width="600" height="440" rx="20" fill="none" stroke="#E2D9CF" stroke-width="1" />

  <!-- Bottom Label Pill -->
  <g transform="translate(400, 555)">
    <rect x="-160" y="-14" width="320" height="28" rx="14" fill="#FFFFFF" stroke="#E2D9CF" stroke-width="1" />
    <circle cx="-140" cy="0" r="4" fill="#E91E63" />
    <text x="-125" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#2B2B3A">
      Mini Box Contents • Curated DIY Kit Preview
    </text>
  </g>

  <!-- ITEM 1: Happy Birthday Pennant Banner (Spread Across Top) -->
  <g filter="url(#itemShadow)">
    <path d="M 140 135 Q 400 170 660 135" stroke="#E2D9CF" stroke-width="2" fill="none" />
    <!-- Pennants -->
    <polygon points="170,140 190,175 150,175" fill="#E91E63" />
    <text x="170" y="165" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">H</text>
    
    <polygon points="210,145 230,180 190,180" fill="#FFB400" />
    <text x="210" y="170" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">A</text>
    
    <polygon points="250,149 270,184 230,184" fill="#00A8A8" />
    <text x="250" y="174" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">P</text>
    
    <polygon points="290,152 310,187 270,187" fill="#E91E63" />
    <text x="290" y="177" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">P</text>
    
    <polygon points="330,154 350,189 310,189" fill="#FFB400" />
    <text x="330" y="179" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Y</text>
    
    <!-- Star divider -->
    <circle cx="400" cy="160" r="8" fill="#FFB400" />
    <text x="400" y="164" font-family="'Poppins', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">★</text>
    
    <polygon points="450,154 470,189 430,189" fill="#00A8A8" />
    <text x="450" y="179" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">B</text>
    
    <polygon points="490,152 510,187 470,187" fill="#E91E63" />
    <text x="490" y="177" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">D</text>
    
    <polygon points="530,149 550,184 510,184" fill="#FFB400" />
    <text x="530" y="174" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">A</text>
    
    <polygon points="570,145 590,180 550,180" fill="#00A8A8" />
    <text x="570" y="170" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Y</text>
  </g>

  <!-- ITEM 2: 12 Latex Balloons Cluster (Arranged in Pastel Pop Harmony) -->
  <g filter="url(#softContactShadow)">
    <!-- Back Row Balloons -->
    <ellipse cx="270" cy="270" rx="46" ry="58" fill="url(#lilacRealistic)" />
    <ellipse cx="255" cy="250" rx="10" ry="18" fill="#FFFFFF" opacity="0.4" transform="rotate(-20 255 250)" />
    <path d="M 270 328 L 266 336 L 274 336 Z" fill="#9356A5" />

    <ellipse cx="530" cy="270" rx="46" ry="58" fill="url(#peachRealistic)" />
    <ellipse cx="515" cy="250" rx="10" ry="18" fill="#FFFFFF" opacity="0.4" transform="rotate(-20 515 250)" />
    <path d="M 530 328 L 526 336 L 534 336 Z" fill="#D97238" />

    <ellipse cx="400" cy="240" rx="48" ry="60" fill="url(#creamRealistic)" />
    <ellipse cx="385" cy="220" rx="10" ry="18" fill="#FFFFFF" opacity="0.4" transform="rotate(-20 385 220)" />
    <path d="M 400 300 L 396 308 L 404 308 Z" fill="#D9BC93" />

    <!-- Front Row Balloons -->
    <ellipse cx="330" cy="300" rx="52" ry="66" fill="url(#peachRealistic)" />
    <ellipse cx="312" cy="275" rx="12" ry="22" fill="#FFFFFF" opacity="0.45" transform="rotate(-20 312 275)" />
    <path d="M 330 366 L 325 375 L 335 375 Z" fill="#D97238" />

    <ellipse cx="470" cy="300" rx="52" ry="66" fill="url(#lilacRealistic)" />
    <ellipse cx="452" cy="275" rx="12" ry="22" fill="#FFFFFF" opacity="0.45" transform="rotate(-20 452 275)" />
    <path d="M 470 366 L 465 375 L 475 375 Z" fill="#9356A5" />

    <ellipse cx="400" cy="330" rx="50" ry="62" fill="url(#creamRealistic)" />
    <ellipse cx="384" cy="310" rx="11" ry="20" fill="#FFFFFF" opacity="0.45" transform="rotate(-20 384 310)" />
    <path d="M 400 392 L 395 400 L 405 400 Z" fill="#D9BC93" />
  </g>

  <!-- ITEM 3: 6-Piece Cake Candle Pack (Bottom Left) -->
  <g transform="translate(145, 360)" filter="url(#itemShadow)">
    <!-- Candle Blister Box -->
    <rect width="90" height="120" rx="8" fill="#FFFFFF" stroke="#E2D9CF" stroke-width="1.5" />
    <rect x="8" y="8" width="74" height="24" rx="4" fill="#FDF2F8" />
    <text x="45" y="24" font-family="'Poppins', sans-serif" font-size="9" font-weight="700" fill="#C2185B" text-anchor="middle">
      6 CAKE CANDLES
    </text>
    <!-- 6 Candles Standing -->
    <rect x="14" y="44" width="7" height="60" rx="2" fill="url(#candlePink)" />
    <circle cx="17.5" cy="38" r="3" fill="#FFB400" />
    
    <rect x="25" y="44" width="7" height="60" rx="2" fill="url(#candleGold)" />
    <circle cx="28.5" cy="38" r="3" fill="#FFB400" />

    <rect x="36" y="44" width="7" height="60" rx="2" fill="url(#candleTeal)" />
    <circle cx="39.5" cy="38" r="3" fill="#FFB400" />

    <rect x="47" y="44" width="7" height="60" rx="2" fill="url(#candlePink)" />
    <circle cx="50.5" cy="38" r="3" fill="#FFB400" />

    <rect x="58" y="44" width="7" height="60" rx="2" fill="url(#candleGold)" />
    <circle cx="61.5" cy="38" r="3" fill="#FFB400" />

    <rect x="69" y="44" width="7" height="60" rx="2" fill="url(#candleTeal)" />
    <circle cx="72.5" cy="38" r="3" fill="#FFB400" />
  </g>

  <!-- ITEM 4: DIY Instruction Card (Bottom Right) -->
  <g transform="translate(565, 360)" filter="url(#itemShadow)">
    <rect width="90" height="120" rx="8" fill="#FFFFFF" stroke="#E2D9CF" stroke-width="1.5" />
    <rect x="0" y="0" width="90" height="26" rx="8" fill="#00A8A8" />
    <rect x="0" y="20" width="90" height="6" fill="#00A8A8" />
    <text x="45" y="17" font-family="'Poppins', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      DIY SETUP GUIDE
    </text>
    <!-- Step lines & diagrams -->
    <line x1="12" y1="42" x2="78" y2="42" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" />
    <line x1="12" y1="56" x2="68" y2="56" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" />
    <line x1="12" y1="70" x2="74" y2="70" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" />
    
    <rect x="12" y="86" width="66" height="22" rx="6" fill="#F0FDFA" stroke="#00A8A8" stroke-width="1" />
    <text x="45" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#0F766E" text-anchor="middle">
      ⏱ 15–20 Mins DIY
    </text>
  </g>

  <!-- ITEM 5 & 6: 1M Arch Strip + Glue Dots Roll + Curling Ribbon (Center Bottom) -->
  <g transform="translate(300, 430)" filter="url(#itemShadow)">
    <!-- 1M Balloon Arch Strip Roll -->
    <circle cx="0" cy="0" r="24" fill="#FFFFFF" stroke="#FFB400" stroke-width="3" stroke-dasharray="6 3" />
    <circle cx="0" cy="0" r="10" fill="#FFFBEB" />
    <text x="0" y="3" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="800" fill="#B45309" text-anchor="middle">1M ARCH</text>
  </g>

  <g transform="translate(500, 430)" filter="url(#itemShadow)">
    <!-- 10 Glue Dots Roll -->
    <circle cx="0" cy="0" r="22" fill="#FFFFFF" stroke="#E91E63" stroke-width="3" />
    <circle cx="0" cy="0" r="8" fill="#FDF2F8" />
    <text x="0" y="3" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="800" fill="#C2185B" text-anchor="middle">GLUE DOTS</text>
  </g>

  <g transform="translate(400, 440)" filter="url(#itemShadow)">
    <!-- 2M Curling Ribbon Spool -->
    <rect x="-24" y="-12" width="48" height="24" rx="4" fill="#00A8A8" />
    <line x1="-16" y1="-12" x2="-16" y2="12" stroke="#FFFFFF" stroke-width="2" />
    <line x1="16" y1="-12" x2="16" y2="12" stroke="#FFFFFF" stroke-width="2" />
    <text x="0" y="3" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="800" fill="#FFFFFF" text-anchor="middle">2M RIBBON</text>
  </g>

  <!-- Brand Packaging Seal Sticker -->
  <g transform="translate(400, 290)" filter="url(#itemShadow)">
    <circle cx="0" cy="0" r="28" fill="#E91E63" />
    <circle cx="0" cy="0" r="25" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="3 2" />
    <text x="0" y="-4" font-family="'Poppins', sans-serif" font-size="7" font-weight="800" fill="#FFFFFF" text-anchor="middle">CELEBRATION</text>
    <text x="0" y="6" font-family="'Poppins', sans-serif" font-size="8" font-weight="800" fill="#FFB400" text-anchor="middle">BOX</text>
    <text x="0" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="5" font-weight="700" fill="#FFFFFF" text-anchor="middle">MINI • ₹249</text>
  </g>
</svg>
