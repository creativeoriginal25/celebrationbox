<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#FFF0E6" />
    </linearGradient>
    <linearGradient id="peachBall" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#FFD6BF" />
      <stop offset="60%" stop-color="#FFBE98" />
      <stop offset="100%" stop-color="#F29363" />
    </linearGradient>
    <linearGradient id="lilacBall" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#F0DCF7" />
      <stop offset="60%" stop-color="#D8B4E2" />
      <stop offset="100%" stop-color="#B281C4" />
    </linearGradient>
    <linearGradient id="creamBall" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FFF4E0" />
      <stop offset="100%" stop-color="#F7DFB3" />
    </linearGradient>
    <!-- Box Gradients -->
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF337A" />
      <stop offset="100%" stop-color="#D81B60" />
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFC837" />
      <stop offset="100%" stop-color="#FF9800" />
    </linearGradient>
    <!-- Soft Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#2B2B3A" flood-opacity="0.12" />
    </filter>
    <filter id="floatGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#E91E63" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Backdrop Circles -->
  <circle cx="200" cy="180" r="140" fill="#FFE5D9" opacity="0.6" />
  <circle cx="620" cy="220" r="160" fill="#E8D5F2" opacity="0.5" />
  <circle cx="400" cy="500" r="180" fill="#FFF4E0" opacity="0.6" />

  <!-- Ground Shadow -->
  <ellipse cx="400" cy="490" rx="260" ry="32" fill="#2B2B3A" opacity="0.08" />
  <ellipse cx="400" cy="485" rx="190" ry="20" fill="#2B2B3A" opacity="0.12" />

  <!-- Balloons Cluster (Pastel Pop Theme) -->
  <!-- Back Balloons -->
  <g filter="url(#shadow)">
    <!-- Lilac balloon left -->
    <ellipse cx="280" cy="240" rx="55" ry="68" fill="url(#lilacBall)" />
    <path d="M 280 308 L 277 318 L 283 318 Z" fill="#B281C4" />
    <path d="M 280 318 Q 300 370 330 410" stroke="#B281C4" stroke-width="2" fill="none" opacity="0.6" />

    <!-- Cream balloon high -->
    <ellipse cx="410" cy="170" rx="58" ry="72" fill="url(#creamBall)" />
    <path d="M 410 242 L 407 252 L 413 252 Z" fill="#E8CD96" />
    <path d="M 410 252 Q 410 320 390 400" stroke="#E8CD96" stroke-width="2" fill="none" opacity="0.6" />

    <!-- Peach balloon right -->
    <ellipse cx="530" cy="230" rx="56" ry="70" fill="url(#peachBall)" />
    <path d="M 530 300 L 526 310 L 534 310 Z" fill="#F29363" />
    <path d="M 530 310 Q 500 360 450 410" stroke="#F29363" stroke-width="2" fill="none" opacity="0.6" />
  </g>

  <!-- Front Balloons -->
  <g filter="url(#shadow)">
    <!-- Peach front left -->
    <ellipse cx="330" cy="280" rx="60" ry="75" fill="url(#peachBall)" />
    <path d="M 330 355 L 326 365 L 334 365 Z" fill="#F29363" />
    <path d="M 330 365 Q 350 410 370 430" stroke="#F29363" stroke-width="2" fill="none" opacity="0.6" />
    <!-- Highlight shine -->
    <ellipse cx="310" cy="250" rx="14" ry="24" fill="#FFFFFF" opacity="0.45" transform="rotate(-20 310 250)" />

    <!-- Lilac front right -->
    <ellipse cx="470" cy="275" rx="62" ry="76" fill="url(#lilacBall)" />
    <path d="M 470 351 L 466 361 L 474 361 Z" fill="#B281C4" />
    <path d="M 470 361 Q 450 400 420 430" stroke="#B281C4" stroke-width="2" fill="none" opacity="0.6" />
    <!-- Highlight shine -->
    <ellipse cx="450" cy="245" rx="14" ry="24" fill="#FFFFFF" opacity="0.45" transform="rotate(-20 450 245)" />
  </g>

  <!-- Bunting Banner Garland (Happy Birthday) -->
  <path d="M 180 180 Q 400 230 620 180" stroke="#FFB400" stroke-width="2.5" stroke-dasharray="4 2" fill="none" />
  <!-- Pennants -->
  <polygon points="230,192 250,225 210,225" fill="#E91E63" />
  <polygon points="270,199 290,234 250,234" fill="#00A8A8" />
  <polygon points="310,206 330,241 290,241" fill="#FFB400" />
  <polygon points="350,210 370,245 330,245" fill="#E91E63" />
  <polygon points="390,212 410,247 370,247" fill="#00A8A8" />
  <polygon points="430,210 450,245 410,245" fill="#FFB400" />
  <polygon points="470,206 490,241 450,241" fill="#E91E63" />
  <polygon points="510,199 530,234 490,234" fill="#00A8A8" />
  <polygon points="550,192 570,225 530,225" fill="#FFB400" />

  <!-- Celebration Box Base (Packaging) -->
  <g filter="url(#shadow)">
    <!-- Main Box Body -->
    <path d="M 240 380 L 560 380 L 530 490 L 270 490 Z" fill="url(#boxGrad)" />
    <!-- Yellow Ribbon band down middle -->
    <path d="M 380 380 L 420 380 L 415 490 L 385 490 Z" fill="url(#goldRibbon)" />

    <!-- Open Lid Flaps -->
    <!-- Left flap -->
    <polygon points="240,380 200,340 330,350 300,380" fill="#C2185B" />
    <!-- Right flap -->
    <polygon points="560,380 600,340 470,350 500,380" fill="#C2185B" />

    <!-- Box Front Label -->
    <rect x="330" y="415" width="140" height="42" rx="8" fill="#FFFFFF" />
    <text x="400" y="435" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#2B2B3A" text-anchor="middle">CELEBRATION</text>
    <text x="400" y="449" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#E91E63" text-anchor="middle">MINI BOX • ₹249</text>
  </g>

  <!-- Inclusions Accessories Display (Peeking Out & Arranged) -->
  <!-- 6-Piece Candle Pack -->
  <g transform="translate(180, 410) rotate(-12)" filter="url(#shadow)">
    <rect x="0" y="0" width="65" height="90" rx="6" fill="#FFFFFF" stroke="#FFB400" stroke-width="2" />
    <rect x="6" y="6" width="53" height="18" rx="3" fill="#FFF8E1" />
    <text x="32" y="19" font-size="8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" fill="#B27B00" text-anchor="middle">CANDLES (6)</text>
    <!-- 6 colorful candles -->
    <rect x="10" y="32" width="5" height="48" fill="#E91E63" rx="1" />
    <rect x="18" y="32" width="5" height="48" fill="#FFB400" rx="1" />
    <rect x="26" y="32" width="5" height="48" fill="#00A8A8" rx="1" />
    <rect x="34" y="32" width="5" height="48" fill="#E91E63" rx="1" />
    <rect x="42" y="32" width="5" height="48" fill="#FFB400" rx="1" />
    <rect x="50" y="32" width="5" height="48" fill="#00A8A8" rx="1" />
    <!-- Candle flames -->
    <circle cx="12.5" cy="28" r="2.5" fill="#FFB400" />
    <circle cx="20.5" cy="28" r="2.5" fill="#FFB400" />
    <circle cx="28.5" cy="28" r="2.5" fill="#FFB400" />
    <circle cx="36.5" cy="28" r="2.5" fill="#FFB400" />
    <circle cx="44.5" cy="28" r="2.5" fill="#FFB400" />
    <circle cx="52.5" cy="28" r="2.5" fill="#FFB400" />
  </g>

  <!-- DIY Guide Card -->
  <g transform="translate(555, 410) rotate(10)" filter="url(#shadow)">
    <rect x="0" y="0" width="75" height="95" rx="6" fill="#FFFFFF" stroke="#00A8A8" stroke-width="2" />
    <rect x="0" y="0" width="75" height="24" rx="4" fill="#00A8A8" />
    <text x="37" y="16" font-size="9" font-family="'Outfit', sans-serif" font-weight="bold" fill="#FFFFFF" text-anchor="middle">DIY GUIDE</text>
    <line x1="10" y1="36" x2="65" y2="36" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" />
    <line x1="10" y1="48" x2="55" y2="48" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" />
    <line x1="10" y1="60" x2="60" y2="60" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" />
    <circle cx="22" cy="78" r="6" fill="#E91E63" />
    <text x="22" y="81" font-size="8" fill="#FFF" font-weight="bold" text-anchor="middle">✓</text>
    <text x="34" y="81" font-size="8" font-family="'Plus Jakarta Sans', sans-serif" fill="#2B2B3A">15 MINS</text>
  </g>

  <!-- Glue dots and arch strip rolls -->
  <g transform="translate(480, 480)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="18" fill="#FFFFFF" stroke="#E91E63" stroke-width="3" />
    <circle cx="0" cy="0" r="8" fill="#FCE4EC" />
    <text x="0" y="2" font-size="7" font-weight="bold" fill="#E91E63" text-anchor="middle">DOTS</text>
  </g>
  <g transform="translate(300, 485)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="19" fill="#FFFFFF" stroke="#FFB400" stroke-width="3" stroke-dasharray="4 2" />
    <circle cx="0" cy="0" r="8" fill="#FFF8E1" />
    <text x="0" y="2" font-size="6" font-weight="bold" fill="#B27B00" text-anchor="middle">1M ARCH</text>
  </g>

  <!-- Confetti and Sparkles -->
  <circle cx="150" cy="140" r="4" fill="#FFB400" />
  <circle cx="680" cy="150" r="5" fill="#E91E63" />
  <circle cx="630" cy="330" r="4" fill="#00A8A8" />
  <circle cx="160" cy="340" r="4" fill="#FFBE98" />
  <polygon points="650,260 655,270 665,275 655,280 650,290 645,280 635,275 645,270" fill="#FFB400" />
  <polygon points="170,240 174,248 182,252 174,256 170,264 166,256 158,252 166,248" fill="#E91E63" />
</svg>

