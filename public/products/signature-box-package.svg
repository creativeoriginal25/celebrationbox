<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="sigPackStudioBg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#FAF4EE" />
      <stop offset="100%" stop-color="#ECE1D2" />
    </radialGradient>
    <linearGradient id="sigBoxBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F7" />
      <stop offset="50%" stop-color="#FCE7F3" />
      <stop offset="100%" stop-color="#FBCFE8" />
    </linearGradient>
    <linearGradient id="sigBoxLid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FDF2F8" />
    </linearGradient>
    <filter id="sigPackShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#2B2B3A" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sigPackStudioBg)" />

  <!-- Package View Header Badge -->
  <rect x="50" y="30" width="700" height="42" rx="10" fill="#FFFFFF" stroke="#E2D9CF" />
  <text x="75" y="56" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#2B2B3A">SIGNATURE CELEBRATION BOX — PREMIUM PARTY PACKAGING</text>
  <text x="725" y="56" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#E91E63" text-anchor="end">Large 32 x 24 x 8 cm Box • Complete Party In A Box</text>

  <!-- Large Isometric Presentation Box -->
  <g filter="url(#sigPackShadow)" transform="translate(170, 130)">
    <!-- Box Lid -->
    <path d="M 230 60 L 440 160 L 230 260 L 20 160 Z" fill="url(#sigBoxLid)" stroke="#F472B6" stroke-width="2" />
    <!-- Box Left Face -->
    <path d="M 20 160 L 230 260 L 230 400 L 20 300 Z" fill="url(#sigBoxBody)" stroke="#F472B6" stroke-width="2" />
    <!-- Box Right Face -->
    <path d="M 230 260 L 440 160 L 440 300 L 230 400 Z" fill="#F472B6" opacity="0.4" stroke="#F472B6" stroke-width="2" />

    <!-- Satin Gold & Rani Pink Cross Ribbon -->
    <path d="M 125 110 L 150 122 L 150 350 L 125 338 Z" fill="#E91E63" />
    <path d="M 230 60 L 255 72 L 345 208 L 320 196 Z" fill="#FFB400" />

    <!-- Premium Seal Emblem on Lid -->
    <g transform="translate(230, 160)">
      <ellipse cx="0" cy="0" rx="70" ry="36" fill="#FFFFFF" stroke="#E91E63" stroke-width="2" />
      <circle cx="0" cy="0" r="22" fill="#E91E63" />
      <text x="0" y="5" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">CB</text>
      <text x="0" y="24" font-family="system-ui, sans-serif" font-size="7.5" font-weight="800" fill="#2B2B3A" text-anchor="middle" letter-spacing="1">SIGNATURE EDITION</text>
    </g>

    <!-- Side Badge on Front Face -->
    <g transform="translate(110, 240)">
      <rect x="0" y="0" width="80" height="54" rx="4" fill="#FFFFFF" stroke="#CBD5E1" transform="skewY(25)" />
      <text x="40" y="18" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#E91E63" text-anchor="middle" transform="skewY(25)">SIGNATURE BOX</text>
      <text x="40" y="30" font-family="system-ui, sans-serif" font-size="5.5" font-weight="600" fill="#64748B" text-anchor="middle" transform="skewY(25)">Includes Pump + Curtain</text>
      <text x="40" y="42" font-family="system-ui, sans-serif" font-size="6" font-weight="bold" fill="#00A8A8" text-anchor="middle" transform="skewY(25)">₹499 Complete</text>
    </g>
  </g>

  <!-- Left: Kit Highlights -->
  <g filter="url(#sigPackShadow)" transform="translate(70, 430)">
    <rect width="280" height="120" rx="12" fill="#FFFFFF" stroke="#E2D9CF" />
    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#2B2B3A">SIGNATURE PACKAGING HIGHLIGHTS</text>
    <text x="20" y="48" font-family="system-ui, sans-serif" font-size="9.5" fill="#475569">✓ Rigid presentation party box with magnetic feel</text>
    <text x="20" y="68" font-family="system-ui, sans-serif" font-size="9.5" fill="#475569">✓ Custom protection for 6ft backdrop &amp; pump</text>
    <text x="20" y="88" font-family="system-ui, sans-serif" font-size="9.5" fill="#475569">✓ Perfect as a surprise party present</text>
    <text x="20" y="106" font-family="system-ui, sans-serif" font-size="9.5" fill="#475569">✓ 100% complete DIY kit with zero prep needed</text>
  </g>

  <!-- Right: Dimensions & Weight Badge -->
  <g filter="url(#sigPackShadow)" transform="translate(480, 440)">
    <rect width="250" height="100" rx="12" fill="#FDF2F8" stroke="#FCE7F3" />
    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#BE123C">SIGNATURE SPECIFICATIONS</text>
    <text x="20" y="46" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#9F1239">Dimensions: 32 cm × 24 cm × 8 cm</text>
    <text x="20" y="64" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#9F1239">Weight: ~650 grams (All-in-one)</text>
    <text x="20" y="82" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#9F1239">Includes: Pump, Backdrop, 20 Balloons, Props</text>
  </g>
</svg>