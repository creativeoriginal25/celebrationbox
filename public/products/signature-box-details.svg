<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="sigMacroBg" cx="40%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FAF5EF" />
      <stop offset="100%" stop-color="#EDE1D1" />
    </radialGradient>
    <radialGradient id="metallicGoldFoil" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFDE7" />
      <stop offset="35%" stop-color="#FFF176" />
      <stop offset="70%" stop-color="#FBC02D" />
      <stop offset="100%" stop-color="#F57F17" />
    </radialGradient>
    <linearGradient id="pumpTealDetail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF" /><stop offset="50%" stop-color="#00A8A8" /><stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <filter id="sigMacroShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#2B2B3A" flood-opacity="0.14" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sigMacroBg)" />

  <!-- Macro Title Badge -->
  <rect x="50" y="35" width="700" height="44" rx="10" fill="#FFFFFF" stroke="#E2D9CF" />
  <text x="75" y="62" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#2B2B3A">SIGNATURE BOX — PREMIUM STATEMENT COMPONENTS</text>
  <text x="725" y="62" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#E91E63" text-anchor="end">18&quot; Foil Balloon • Balloon Pump • Photo Booth Props</text>

  <!-- Left: 18-Inch Metallic Foil Balloon Close-Up -->
  <g filter="url(#sigMacroShadow)" transform="translate(230, 310)">
    <!-- Foil balloon body -->
    <circle cx="0" cy="0" r="140" fill="url(#metallicGoldFoil)" stroke="#D97706" stroke-width="3" />
    <!-- Foil crinkle reflections / highlights -->
    <path d="M -90 -70 Q -40 -120 40 -110 Q -20 -70 -90 -70 Z" fill="#FFFFFF" opacity="0.6" />
    <ellipse cx="60" cy="-60" rx="35" ry="18" fill="#FFFFFF" opacity="0.4" transform="rotate(25 60 -60)" />
    <!-- Lettering embossed -->
    <text x="0" y="-12" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#78350F" text-anchor="middle" letter-spacing="3">HAPPY</text>
    <text x="0" y="32" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#78350F" text-anchor="middle" letter-spacing="2">BIRTHDAY</text>
    <!-- Foil valve tab -->
    <rect x="-14" y="138" width="28" height="24" rx="4" fill="#F59E0B" stroke="#B45309" />
    <circle cx="0" cy="150" r="4" fill="#FFFFFF" />
    <!-- Star Glints -->
    <path d="M -60 -40 L -57 -47 L -50 -44 L -53 -37 L -46 -34 L -53 -31 L -50 -24 L -57 -21 L -60 -28 L -67 -21 L -64 -28 Z" fill="#FFFFFF" />
    <path d="M 75 45 L 77 39 L 83 41 L 80 47 L 86 49 L 80 51 L 83 57 L 77 55 L 75 61 L 73 55 Z" fill="#FFFFFF" />
  </g>

  <!-- Right: Dual Action Pump & Photo Booth Props Detail Panel -->
  <g filter="url(#sigMacroShadow)" transform="translate(450, 110)">
    <rect width="300" height="430" rx="16" fill="#FFFFFF" stroke="#E2D9CF" stroke-width="1" />
    
    <!-- Top Half: Manual Dual Action Pump -->
    <text x="24" y="34" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#2B2B3A">MANUAL DUAL-ACTION PUMP</text>
    <text x="24" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">Inflates on both push &amp; pull strokes</text>

    <g transform="translate(50, 75)">
      <!-- Pump nozzle -->
      <polygon points="30,0 40,0 42,24 28,24" fill="#E91E63" />
      <!-- Pump cylinder -->
      <rect x="20" y="24" width="30" height="90" rx="6" fill="url(#pumpTealDetail)" />
      <line x1="20" y1="45" x2="50" y2="45" stroke="#008080" stroke-width="2" />
      <line x1="20" y1="65" x2="50" y2="65" stroke="#008080" stroke-width="2" />
      <line x1="20" y1="85" x2="50" y2="85" stroke="#008080" stroke-width="2" />
      <!-- Pump handle -->
      <rect x="32" y="114" width="6" height="24" fill="#94A3B8" />
      <ellipse cx="35" cy="142" rx="20" ry="7" fill="#E91E63" />
      <!-- Spec Label -->
      <rect x="90" y="45" width="100" height="42" rx="6" fill="#F0FDFA" />
      <text x="140" y="63" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#0F766E" text-anchor="middle">Included in Box</text>
      <text x="140" y="78" font-family="system-ui, sans-serif" font-size="8" fill="#14B8A6" text-anchor="middle">No lungs needed!</text>
    </g>

    <!-- Bottom Half: Photo Booth Props -->
    <line x1="20" y1="245" x2="280" y2="245" stroke="#F1F5F9" stroke-width="2" />
    <text x="24" y="270" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#2B2B3A">6 PHOTO BOOTH PROPS</text>
    <text x="24" y="286" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">Mounted on 25cm wooden dowels</text>

    <g transform="translate(40, 305)">
      <!-- Mustache Prop -->
      <line x1="30" y1="20" x2="30" y2="75" stroke="#B45309" stroke-width="2" />
      <path d="M 30 20 C 15 5 0 20 0 26 C 15 26 27 20 30 22 C 33 20 45 26 60 26 C 60 20 45 5 30 20 Z" fill="#1E293B" />

      <!-- Glam Glasses -->
      <line x1="120" y1="20" x2="120" y2="75" stroke="#B45309" stroke-width="2" />
      <rect x="88" y="6" width="64" height="26" rx="6" fill="#E91E63" />
      <circle cx="104" cy="19" r="8" fill="#FFF" /><circle cx="136" cy="19" r="8" fill="#FFF" />
      <!-- Star Sparkle on glass -->
      <polygon points="144,14 146,10 148,14 152,16 148,18 146,22 144,18 140,16" fill="#FFB400" />

      <!-- Party Crown -->
      <line x1="200" y1="20" x2="200" y2="75" stroke="#B45309" stroke-width="2" />
      <polygon points="175,25 185,5 200,18 215,5 225,25" fill="#FFB400" stroke="#D97706" />
    </g>

    <!-- Bottom Pill -->
    <rect x="25" y="390" width="250" height="26" rx="6" fill="#FFF1F2" />
    <text x="150" y="407" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#BE123C" text-anchor="middle">Perfect for Instagram &amp; Group Selfies</text>
  </g>
</svg>