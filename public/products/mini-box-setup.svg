<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="wallBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="75%" stop-color="#F4ECE1" />
      <stop offset="75%" stop-color="#D5C5B5" />
      <stop offset="100%" stop-color="#BEAA96" />
    </linearGradient>
    <linearGradient id="deskWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2D4C3" /><stop offset="100%" stop-color="#CBB7A0" />
    </linearGradient>
    <filter id="wallShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2B2B3A" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Wall & Floor -->
  <rect width="800" height="600" fill="url(#wallBg)" />

  <!-- Room Setup Header Badge -->
  <rect x="50" y="30" width="700" height="42" rx="10" fill="#FFFFFF" stroke="#E2D9CF" />
  <text x="75" y="56" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#2B2B3A">MINI BOX — BEDROOM &amp; HOSTEL SETUP EXAMPLE</text>
  <text x="725" y="56" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#E91E63" text-anchor="end">Setup Time: ~15-20 Minutes • Removable Wall Dots</text>

  <!-- Celebration Setup Wall Elements -->
  <!-- 1. Happy Birthday Banner strung along the wall -->
  <g filter="url(#wallShadow)" transform="translate(140, 110)">
    <path d="M 0 30 Q 260 65 520 28" stroke="#78350F" stroke-width="2" fill="none" />
    <!-- Letter Pennants -->
    <g transform="translate(40, 26)">
      <polygon points="0,0 28,0 14,34" fill="#E91E63" /><text x="14" y="20" fill="#FFF" font-size="12" font-weight="bold" text-anchor="middle">H</text>
      <polygon points="36,0 64,0 50,34" fill="#00A8A8" /><text x="50" y="20" fill="#FFF" font-size="12" font-weight="bold" text-anchor="middle">A</text>
      <polygon points="72,0 100,0 86,34" fill="#FFB400" /><text x="86" y="20" fill="#FFF" font-size="12" font-weight="bold" text-anchor="middle">P</text>
      <polygon points="108,0 136,0 122,34" fill="#E91E63" /><text x="122" y="20" fill="#FFF" font-size="12" font-weight="bold" text-anchor="middle">P</text>
      <polygon points="144,0 172,0 158,34" fill="#00A8A8" /><text x="158" y="20" fill="#FFF" font-size="12" font-weight="bold" text-anchor="middle">Y</text>
      <!-- BIRTHDAY -->
      <polygon points="196,0 224,0 210,34" fill="#E91E63" /><text x="210" y="20" fill="#FFF" font-size="12" font-weight="bold" text-anchor="middle">B</text>
      <polygon points="232,0 260,0 246,34" fill="#FFB400" /><text x="246" y="20" fill="#FFF" font-size="12" font-weight="bold" text-anchor="middle">I</text>
      <polygon points="268,0 296,0 282,34" fill="#00A8A8" /><text x="282" y="20" fill="#FFF" font-size="12" font-weight="bold" text-anchor="middle">R</text>
      <polygon points="304,0 332,0 318,34" fill="#E91E63" /><text x="318" y="20" fill="#FFF" font-size="12" font-weight="bold" text-anchor="middle">T</text>
      <polygon points="340,0 368,0 354,34" fill="#00A8A8" /><text x="354" y="20" fill="#FFF" font-size="12" font-weight="bold" text-anchor="middle">H</text>
      <polygon points="376,0 404,0 390,34" fill="#FFB400" /><text x="390" y="20" fill="#FFF" font-size="12" font-weight="bold" text-anchor="middle">D</text>
      <polygon points="412,0 440,0 426,34" fill="#E91E63" /><text x="426" y="20" fill="#FFF" font-size="12" font-weight="bold" text-anchor="middle">A</text>
      <polygon points="448,0 476,0 462,34" fill="#00A8A8" /><text x="462" y="20" fill="#FFF" font-size="12" font-weight="bold" text-anchor="middle">Y</text>
    </g>
  </g>

  <!-- 2. Pastel Pop Balloon Arch / Garland (12 Balloons clustered artfully along banner) -->
  <g filter="url(#wallShadow)" transform="translate(100, 160)">
    <!-- Garland curved strip (1m) -->
    <!-- Left cluster -->
    <ellipse cx="60" cy="80" rx="36" ry="46" fill="#FFBE98" transform="rotate(-15 60 80)" />
    <ellipse cx="100" cy="50" rx="32" ry="42" fill="#D8B4E2" transform="rotate(10 100 50)" />
    <ellipse cx="130" cy="95" rx="34" ry="44" fill="#FFF5E5" stroke="#E2D9CF" />
    <ellipse cx="80" cy="115" rx="30" ry="38" fill="#FFBE98" />

    <!-- Center clusters -->
    <ellipse cx="280" cy="35" rx="32" ry="40" fill="#D8B4E2" transform="rotate(-8 280 35)" />
    <ellipse cx="325" cy="40" rx="30" ry="38" fill="#FFF5E5" stroke="#E2D9CF" />
    <ellipse cx="365" cy="35" rx="32" ry="40" fill="#FFBE98" transform="rotate(12 365 35)" />

    <!-- Right cluster -->
    <ellipse cx="490" cy="70" rx="32" ry="42" fill="#D8B4E2" transform="rotate(-12 490 70)" />
    <ellipse cx="535" cy="50" rx="35" ry="45" fill="#FFBE98" transform="rotate(15 535 50)" />
    <ellipse cx="510" cy="110" rx="30" ry="38" fill="#FFF5E5" stroke="#E2D9CF" />
    <ellipse cx="555" cy="95" rx="32" ry="42" fill="#D8B4E2" />
    <ellipse cx="460" cy="90" rx="28" ry="36" fill="#FFBE98" />
  </g>

  <!-- Desk / Celebration Table with Cake and Candles -->
  <g transform="translate(200, 360)" filter="url(#wallShadow)">
    <!-- Table Top -->
    <rect x="0" y="50" width="400" height="24" rx="4" fill="url(#deskWood)" />
    <rect x="30" y="74" width="16" height="130" fill="#A89480" />
    <rect x="354" y="74" width="16" height="130" fill="#A89480" />

    <!-- Tablecloth / Runner -->
    <rect x="120" y="48" width="160" height="40" rx="2" fill="#FFFFFF" opacity="0.9" />

    <!-- Cake Stand & Cake -->
    <path d="M 170 50 L 230 50 L 210 40 L 190 40 Z" fill="#E2E8F0" />
    <ellipse cx="200" cy="40" rx="45" ry="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <!-- Cake Tier -->
    <rect x="165" y="0" width="70" height="38" rx="6" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="1" />
    <ellipse cx="200" cy="0" rx="35" ry="8" fill="#FFE4E6" stroke="#FDA4AF" stroke-width="1" />
    <!-- 6 Candles lit on cake -->
    <g transform="translate(178, -26)">
      <rect x="5" y="10" width="3" height="16" fill="#E91E63" /><circle cx="6.5" cy="8" r="2" fill="#F59E0B" />
      <rect x="14" y="8" width="3" height="18" fill="#FFB400" /><circle cx="15.5" cy="6" r="2" fill="#F59E0B" />
      <rect x="23" y="10" width="3" height="16" fill="#00A8A8" /><circle cx="24.5" cy="8" r="2" fill="#F59E0B" />
      <rect x="32" y="8" width="3" height="18" fill="#E91E63" /><circle cx="33.5" cy="6" r="2" fill="#F59E0B" />
    </g>

    <!-- Mini Celebration Box placed on table -->
    <g transform="translate(40, 20)">
      <rect x="0" y="0" width="60" height="32" rx="4" fill="#FFFDF8" stroke="#E2D9CF" stroke-width="1.5" />
      <rect x="0" y="0" width="60" height="8" rx="2" fill="#E91E63" />
      <text x="30" y="20" font-family="system-ui, sans-serif" font-size="6" font-weight="bold" fill="#2B2B3A" text-anchor="middle">MINI BOX</text>
    </g>
  </g>

  <!-- Callout annotation -->
  <rect x="560" y="470" width="190" height="48" rx="8" fill="#FFFFFF" stroke="#00A8A8" stroke-width="1.5" filter="url(#wallShadow)" />
  <text x="655" y="490" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#00A8A8" text-anchor="middle">✓ Hostel Wall Safe</text>
  <text x="655" y="506" font-family="system-ui, sans-serif" font-size="9" fill="#64748B" text-anchor="middle">No paint peeling with our glue dots</text>
</svg>