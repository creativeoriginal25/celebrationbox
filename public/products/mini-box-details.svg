<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="macroBg" cx="40%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FAF5EF" />
      <stop offset="100%" stop-color="#EDE1D1" />
    </radialGradient>
    <linearGradient id="macroPeach" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FFE4D6" />
      <stop offset="40%" stop-color="#FFBE98" />
      <stop offset="90%" stop-color="#E87B40" />
    </linearGradient>
    <linearGradient id="macroLilac" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FCEBFF" />
      <stop offset="40%" stop-color="#D8B4E2" />
      <stop offset="90%" stop-color="#9C52B0" />
    </linearGradient>
    <linearGradient id="macroCream" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FFF6E8" />
      <stop offset="90%" stop-color="#D9BC93" />
    </linearGradient>
    <filter id="macroShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#2B2B3A" flood-opacity="0.14" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#macroBg)" />

  <!-- Macro Title Badge -->
  <rect x="50" y="35" width="700" height="44" rx="10" fill="#FFFFFF" stroke="#E2D9CF" />
  <text x="75" y="62" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#2B2B3A">MINI BOX — MATERIAL &amp; TEXTURE DETAILS</text>
  <text x="725" y="62" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#00A8A8" text-anchor="end">Premium 3.2g Natural Latex • Rich Matte Cardstock</text>

  <!-- Left: Big Glossy Balloon Close-up Cluster -->
  <g filter="url(#macroShadow)" transform="translate(180, 310)">
    <!-- Lilac Balloon (left back) -->
    <ellipse cx="-70" cy="-60" rx="90" ry="110" fill="url(#macroLilac)" transform="rotate(-15 -70 -60)" />
    <ellipse cx="-90" cy="-95" rx="20" ry="40" fill="#FFFFFF" opacity="0.45" transform="rotate(-30 -90 -95)" />

    <!-- Cream Balloon (right back) -->
    <ellipse cx="80" cy="-50" rx="85" ry="105" fill="url(#macroCream)" stroke="#CBD5E1" stroke-width="1" transform="rotate(18 80 -50)" />
    <ellipse cx="60" cy="-85" rx="18" ry="36" fill="#FFFFFF" opacity="0.6" transform="rotate(-10 60 -85)" />

    <!-- Peach Balloon (front center) -->
    <ellipse cx="0" cy="10" rx="105" ry="130" fill="url(#macroPeach)" />
    <ellipse cx="-25" cy="-35" rx="24" ry="48" fill="#FFFFFF" opacity="0.5" transform="rotate(-25 -25 -35)" />
    <ellipse cx="25" cy="45" rx="8" ry="16" fill="#FFFFFF" opacity="0.25" />
    <!-- Balloon Tie Knot -->
    <path d="M 0 140 L -12 152 L 12 152 Z" fill="#E87B40" />
    <ellipse cx="0" cy="153" rx="10" ry="4" fill="#C05822" />
  </g>

  <!-- Right: Hanging Banner Pennants & Candles Detail -->
  <g filter="url(#macroShadow)" transform="translate(460, 110)">
    <rect width="290" height="430" rx="16" fill="#FFFFFF" stroke="#E2D9CF" stroke-width="1" />
    <text x="24" y="34" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#2B2B3A">PRE-PUNCHED BANNER LETTERS</text>
    <text x="24" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">300 GSM Heavyweight Matte Finish</text>

    <!-- Detailed Banner Pennant "H" -->
    <g transform="translate(40, 75)">
      <polygon points="0,0 80,0 40,110" fill="#E91E63" stroke="#BE123C" stroke-width="1.5" />
      <!-- Gold eyelets -->
      <circle cx="14" cy="14" r="5" fill="#FEF08A" stroke="#B45309" stroke-width="1" />
      <circle cx="66" cy="14" r="5" fill="#FEF08A" stroke="#B45309" stroke-width="1" />
      <text x="40" y="65" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle">H</text>
    </g>

    <!-- Pennant "B" overlay -->
    <g transform="translate(130, 95) rotate(12)">
      <polygon points="0,0 80,0 40,110" fill="#FFB400" stroke="#D97706" stroke-width="1.5" />
      <circle cx="14" cy="14" r="5" fill="#FFFFFF" stroke="#92400E" stroke-width="1" />
      <circle cx="66" cy="14" r="5" fill="#FFFFFF" stroke="#92400E" stroke-width="1" />
      <text x="40" y="65" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle">B</text>
    </g>

    <!-- Birthday Candles Macro Section -->
    <line x1="20" y1="230" x2="270" y2="230" stroke="#F1F5F9" stroke-width="2" />
    <text x="24" y="255" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#2B2B3A">SPARKLING CAKE CANDLES</text>
    <text x="24" y="272" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">Smokeless celebration candles included</text>

    <!-- 3 Rendered Detailed Candles with flames -->
    <g transform="translate(50, 290)">
      <!-- Candle 1: Rani Pink with spiral -->
      <rect x="15" y="30" width="12" height="85" rx="3" fill="#E91E63" />
      <line x1="21" y1="30" x2="21" y2="22" stroke="#334155" stroke-width="2" />
      <path d="M 21 6 C 16 13 18 20 21 22 C 24 20 26 13 21 6 Z" fill="#F59E0B" />
      <circle cx="21" cy="15" r="4" fill="#FEF08A" />

      <!-- Candle 2: Marigold Yellow -->
      <rect x="65" y="20" width="12" height="95" rx="3" fill="#FFB400" />
      <line x1="71" y1="20" x2="71" y2="12" stroke="#334155" stroke-width="2" />
      <path d="M 71 -4 C 66 3 68 10 71 12 C 74 10 76 3 71 -4 Z" fill="#F59E0B" />
      <circle cx="71" cy="5" r="4" fill="#FEF08A" />

      <!-- Candle 3: Teal -->
      <rect x="115" y="35" width="12" height="80" rx="3" fill="#00A8A8" />
      <line x1="121" y1="35" x2="121" y2="27" stroke="#334155" stroke-width="2" />
      <path d="M 121 11 C 116 18 118 25 121 27 C 124 25 126 18 121 11 Z" fill="#F59E0B" />
      <circle cx="121" cy="20" r="4" fill="#FEF08A" />
    </g>

    <!-- Spec Pill -->
    <rect x="25" y="390" width="240" height="26" rx="6" fill="#F0FDFA" />
    <text x="145" y="407" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0F766E" text-anchor="middle">100% Food-Safe Candle Holders Included</text>
  </g>
</svg>